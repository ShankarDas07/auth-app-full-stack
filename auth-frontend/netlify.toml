# Netlify: set "Base directory" to auth-front (Site configuration -> Build & deploy)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 7 needs Node 20.19+ / 22.12+
  NODE_VERSION = "22"

# Serve index.html for client-side routes (e.g. /login, /dashboard)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
